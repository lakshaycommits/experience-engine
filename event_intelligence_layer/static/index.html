<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>District — Event Intelligence</title>
<style>
  :root {
    --bg: #0d0d0d;
    --card: #161616;
    --card-border: #2a2a2a;
    --text: #f0f0f0;
    --text-muted: #888;
    --text-dim: #555;
    --accent: #ff5c5c;
    --ai-gradient: linear-gradient(135deg, #8b5cf6, #ec4899);
    --ai-glow: rgba(139, 92, 246, 0.25);
    --tag-bg: #1e1e1e;
    --tag-border: #333;
    --input-bg: #1a1a1a;
    --panel-bg: #111;
    --panel-border: #222;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    background: rgba(13,13,13,0.95);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .logo { font-size: 22px; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
  .logo span { color: var(--text); font-weight: 300; }
  .header-badge {
    font-size: 11px;
    padding: 3px 8px;
    background: var(--ai-gradient);
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .header-sub {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-dim);
  }

  /* ── Page layout ── */
  main { padding: 28px 24px 60px; max-width: 1100px; margin: 0 auto; }

  .page-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .page-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }

  /* ── Event grid ── */
  .events-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 20px;
  }

  /* ── Event card ── */
  .event-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.15s ease, border-color 0.15s ease;
    cursor: default;
  }
  .event-card:hover { transform: translateY(-2px); border-color: #3a3a3a; }

  .card-image {
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    position: relative;
    overflow: hidden;
  }
  .card-image-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.5) 100%);
  }

  .card-body { padding: 16px; }

  .card-category {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  .card-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }

  .card-meta {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .card-price { font-size: 13px; font-weight: 600; color: #6ee7b7; }

  .vibe-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
    margin-top: 10px;
  }
  .vibe-tag {
    font-size: 11px;
    padding: 3px 8px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    border-radius: 20px;
    color: var(--text-muted);
  }

  .card-actions { display: flex; gap: 10px; }

  .btn-book {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-book:hover { border-color: #555; color: var(--text); }

  .btn-ask {
    flex: 1.4;
    padding: 10px;
    background: var(--ai-gradient);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 0 0 var(--ai-glow);
  }
  .btn-ask:hover { opacity: 0.9; box-shadow: 0 0 20px var(--ai-glow); }

  /* ── Q&A Panel (right drawer) ── */
  .qa-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    backdrop-filter: blur(4px);
  }
  .qa-overlay.open { display: block; }

  .qa-panel {
    position: fixed;
    top: 0;
    right: -480px;
    width: 460px;
    max-width: 100vw;
    height: 100vh;
    background: var(--panel-bg);
    border-left: 1px solid var(--panel-border);
    z-index: 300;
    display: flex;
    flex-direction: column;
    transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }
  .qa-panel.open { right: 0; }

  /* Panel header */
  .qa-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;
  }
  .qa-close {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .qa-close-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
    transition: background 0.1s;
  }
  .qa-close-btn:hover { background: #222; color: var(--text); }
  .qa-event-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.8px; }
  .qa-event-title { font-size: 18px; font-weight: 700; margin-top: 2px; line-height: 1.3; }
  .qa-event-meta { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  /* Suggested questions */
  .qa-suggestions { padding: 16px 20px 0; flex-shrink: 0; }
  .qa-suggestions-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
  .suggestions-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .suggestion-chip {
    font-size: 12px;
    padding: 6px 12px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    border-radius: 20px;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    text-align: left;
  }
  .suggestion-chip:hover {
    background: #1e1e1e;
    border-color: #8b5cf6;
    color: var(--text);
  }

  /* Q&A history */
  .qa-history {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }
  .qa-history::-webkit-scrollbar { width: 4px; }
  .qa-history::-webkit-scrollbar-track { background: transparent; }
  .qa-history::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

  /* Empty state */
  .qa-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    gap: 12px;
    padding: 40px 20px;
    text-align: center;
  }
  .qa-empty-icon { font-size: 40px; opacity: 0.4; }
  .qa-empty-text { font-size: 14px; line-height: 1.5; }

  /* Q&A exchange */
  .qa-exchange { display: flex; flex-direction: column; gap: 10px; }

  .qa-question {
    align-self: flex-end;
    max-width: 88%;
    background: #1d1d1d;
    border: 1px solid #2e2e2e;
    border-radius: 14px 14px 4px 14px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.5;
  }

  .qa-answer-block {
    align-self: flex-start;
    max-width: 95%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .qa-answer-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .qa-ai-badge {
    font-size: 10px;
    padding: 2px 7px;
    background: var(--ai-gradient);
    border-radius: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .qa-confidence {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .conf-high { background: rgba(110, 231, 183, 0.12); color: #6ee7b7; border: 1px solid rgba(110,231,183,0.2); }
  .conf-medium { background: rgba(251, 191, 36, 0.12); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
  .conf-low { background: rgba(248, 113, 113, 0.12); color: #f87171; border: 1px solid rgba(248,113,113,0.2); }

  .qa-answer-text {
    background: #161616;
    border: 1px solid #222;
    border-radius: 4px 14px 14px 14px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.65;
    color: #e8e8e8;
  }

  .qa-sources {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .qa-source-chip {
    font-size: 11px;
    padding: 3px 8px;
    background: transparent;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .qa-source-chip::before { content: "↗"; font-size: 10px; }

  .qa-caveat {
    font-size: 11px;
    color: var(--text-dim);
    padding: 6px 10px;
    background: #151515;
    border-radius: 6px;
    border-left: 2px solid #333;
    line-height: 1.5;
  }

  /* Loading state */
  .qa-loading {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #161616;
    border: 1px solid #222;
    border-radius: 4px 14px 14px 14px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .loading-dots { display: flex; gap: 4px; }
  .loading-dots span {
    width: 6px; height: 6px;
    background: #8b5cf6;
    border-radius: 50%;
    animation: dot-bounce 1.2s infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Panel footer / input */
  .qa-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--panel-border);
    flex-shrink: 0;
  }
  .qa-input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .qa-input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
    padding: 11px 14px;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    line-height: 1.5;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .qa-input:focus { border-color: #8b5cf6; }
  .qa-input::placeholder { color: var(--text-dim); }

  .qa-send-btn {
    width: 44px;
    height: 44px;
    background: var(--ai-gradient);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s;
  }
  .qa-send-btn:hover { opacity: 0.88; }
  .qa-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Error toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 13px;
    color: #f87171;
    z-index: 999;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Responsive */
  @media (max-width: 600px) {
    .qa-panel { width: 100vw; border-left: none; }
    .events-grid { grid-template-columns: 1fr; }
    main { padding: 20px 16px 60px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">district<span>.</span></div>
  <div class="header-badge">✦ Event Intelligence</div>
  <div class="header-sub">Feature 04 — Demo</div>
</header>

<main>
  <h1 class="page-title">Events in Delhi</h1>
  <p class="page-sub">Tap <strong>Ask AI ✨</strong> on any event to ask anything before you book.</p>
  <div class="events-grid" id="eventsGrid">
    <!-- rendered by JS -->
  </div>
</main>

<!-- Q&A overlay -->
<div class="qa-overlay" id="qaOverlay" onclick="closePanel()"></div>

<!-- Q&A panel -->
<div class="qa-panel" id="qaPanel">
  <div class="qa-header">
    <div class="qa-close">
      <button class="qa-close-btn" onclick="closePanel()">✕</button>
      <span class="qa-event-label">Ask about this event</span>
    </div>
    <div class="qa-event-title" id="panelTitle"></div>
    <div class="qa-event-meta" id="panelMeta"></div>
  </div>

  <div class="qa-suggestions" id="qaSuggestions">
    <div class="qa-suggestions-label">Suggested questions</div>
    <div class="suggestions-row" id="suggestionChips"></div>
  </div>

  <div class="qa-history" id="qaHistory">
    <div class="qa-empty" id="qaEmpty">
      <div class="qa-empty-icon">✦</div>
      <div class="qa-empty-text">Ask anything about this event.<br/>I'll answer from venue reviews, artist info, and event details.</div>
    </div>
  </div>

  <div class="qa-footer">
    <div class="qa-input-row">
      <textarea
        class="qa-input"
        id="qaInput"
        placeholder="Type your question..."
        rows="1"
        onkeydown="handleInputKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="qa-send-btn" id="qaSendBtn" onclick="sendQuestion()">→</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = '';
  let currentEvent = null;
  let isLoading = false;

  // ── Render events ──────────────────────────────────────────────────
  async function loadEvents() {
    try {
      const res = await fetch(`${API}/events`);
      const events = await res.json();
      renderGrid(events);
    } catch (e) {
      document.getElementById('eventsGrid').innerHTML =
        '<p style="color:var(--text-muted);padding:20px">Could not load events. Is the server running?</p>';
    }
  }

  function renderGrid(events) {
    const grid = document.getElementById('eventsGrid');
    grid.innerHTML = events.map(ev => `
      <div class="event-card">
        <div class="card-image" style="background: ${ev.image_gradient}">
          <span style="position:relative;z-index:1">${ev.image_emoji}</span>
          <div class="card-image-overlay"></div>
        </div>
        <div class="card-body">
          <div class="card-category">${ev.category}</div>
          <div class="card-title">${ev.title}</div>
          <div class="card-meta">
            <span>${ev.venue} · ${ev.area}</span>
            <span>${ev.date} · ${ev.time}</span>
          </div>
          <div class="card-price">${ev.price}</div>
          <div class="vibe-tags">
            ${ev.vibe_tags.slice(0,4).map(t => `<span class="vibe-tag">${t}</span>`).join('')}
          </div>
          <div class="card-actions">
            <button class="btn-book">Book Now</button>
            <button class="btn-ask" onclick="openPanel(${JSON.stringify(ev).replace(/"/g,'&quot;')})">Ask AI ✨</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  // ── Panel open/close ───────────────────────────────────────────────
  function openPanel(event) {
    currentEvent = event;

    document.getElementById('panelTitle').textContent = event.title;
    document.getElementById('panelMeta').textContent = `${event.venue} · ${event.date}`;

    const chips = document.getElementById('suggestionChips');
    chips.innerHTML = (event.suggested_questions || []).map(q => `
      <button class="suggestion-chip" onclick="askSuggested(this, ${JSON.stringify(q).replace(/"/g,'&quot;')})">${q}</button>
    `).join('');

    // Reset history
    document.getElementById('qaHistory').innerHTML = `
      <div class="qa-empty" id="qaEmpty">
        <div class="qa-empty-icon">✦</div>
        <div class="qa-empty-text">Ask anything about this event.<br/>I'll answer from venue reviews, artist info, and event details.</div>
      </div>
    `;

    document.getElementById('qaInput').value = '';
    document.getElementById('qaOverlay').classList.add('open');
    document.getElementById('qaPanel').classList.add('open');
    setTimeout(() => document.getElementById('qaInput').focus(), 350);
  }

  function closePanel() {
    document.getElementById('qaOverlay').classList.remove('open');
    document.getElementById('qaPanel').classList.remove('open');
    currentEvent = null;
  }

  // ── Ask question ───────────────────────────────────────────────────
  function askSuggested(btn, question) {
    document.getElementById('qaInput').value = question;
    sendQuestion();
  }

  async function sendQuestion() {
    if (isLoading || !currentEvent) return;
    const input = document.getElementById('qaInput');
    const question = input.value.trim();
    if (!question) return;

    input.value = '';
    input.style.height = 'auto';
    isLoading = true;
    document.getElementById('qaSendBtn').disabled = true;

    // Remove empty state
    const empty = document.getElementById('qaEmpty');
    if (empty) empty.remove();

    const history = document.getElementById('qaHistory');

    // Add question bubble
    const exchangeId = 'ex_' + Date.now();
    const exchangeEl = document.createElement('div');
    exchangeEl.className = 'qa-exchange';
    exchangeEl.id = exchangeId;
    exchangeEl.innerHTML = `
      <div class="qa-question">${escapeHtml(question)}</div>
      <div class="qa-loading" id="loading_${exchangeId}">
        <div class="loading-dots"><span></span><span></span><span></span></div>
        Searching event knowledge base...
      </div>
    `;
    history.appendChild(exchangeEl);
    history.scrollTop = history.scrollHeight;

    try {
      const res = await fetch(`${API}/events/${currentEvent.id}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      if (!res.ok) throw new Error('API error');
      const data = await res.json();

      // Replace loading with answer
      const loading = document.getElementById(`loading_${exchangeId}`);
      if (loading) loading.remove();

      const confClass = { high: 'conf-high', medium: 'conf-medium', low: 'conf-low' }[data.confidence] || 'conf-medium';
      const confLabel = { high: 'High confidence', medium: 'Medium confidence', low: 'Low confidence' }[data.confidence] || '';

      const sourcesHtml = data.sources.length
        ? `<div class="qa-sources">${data.sources.map(s =>
            `<span class="qa-source-chip">${s.label}</span>`
          ).join('')}</div>`
        : '';

      const caveatHtml = data.caveat
        ? `<div class="qa-caveat">${escapeHtml(data.caveat)}</div>`
        : '';

      exchangeEl.innerHTML += `
        <div class="qa-answer-block">
          <div class="qa-answer-header">
            <span class="qa-ai-badge">AI</span>
            <span class="qa-confidence ${confClass}">${confLabel}</span>
          </div>
          <div class="qa-answer-text">${escapeHtml(data.answer)}</div>
          ${sourcesHtml}
          ${caveatHtml}
        </div>
      `;

      // Re-add the question at the top of the exchange (clear and rebuild)
      const qEl = exchangeEl.querySelector('.qa-question');
      const remaining = exchangeEl.innerHTML;
      exchangeEl.innerHTML = `<div class="qa-question">${escapeHtml(question)}</div>` + remaining.replace(/<div class="qa-question">.*?<\/div>/, '');

    } catch (e) {
      const loading = document.getElementById(`loading_${exchangeId}`);
      if (loading) {
        loading.outerHTML = `<div class="qa-answer-text" style="color:#f87171;border-color:#3a1a1a;background:#1a0f0f">Something went wrong. Make sure the server is running and your Groq API key is set.</div>`;
      }
      showToast('Could not get answer — check the server');
    } finally {
      isLoading = false;
      document.getElementById('qaSendBtn').disabled = false;
      history.scrollTop = history.scrollHeight;
    }
  }

  // ── Helpers ────────────────────────────────────────────────────────
  function handleInputKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // Escape key closes panel
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

  loadEvents();
</script>
</body>
</html>
